version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: urlshortener_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: urlshortener
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres_test:
    image: postgres:15-alpine
    container_name: urlshortener_postgres_test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: urlshortener_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  test:
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: urlshortener_test
    depends_on:
      postgres_test:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres_test:5432/urlshortener_test
      ROCKET_CONFIG: Rocket.Docker.toml
      RUST_LOG: info
      RUST_BACKTRACE: 1
    command: >
      sh -c "
        echo 'Waiting for database...' &&
        sleep 2 &&
        echo 'Running migrations...' &&
        diesel migration run &&
        echo 'Running tests...' &&
        cargo test -- --test-threads=1 --nocapture
      "
    profiles:
      - test

volumes:
  postgres_data:
